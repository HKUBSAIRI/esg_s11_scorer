<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1.1 报告段落浏览器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%232a5a4c'/%3E%3Cpath d='M5 4h4.5L11 5.5V12H5z' fill='none' stroke='%23fff' stroke-width='1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="explorer.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-code">S1.1</span>
    <span class="brand-title">报告段落浏览器</span>
  </div>
  <div class="docmeta" id="docMeta"></div>
  <div class="actions">
    <button class="btn ghost btn-pdf" id="btnPdf">PDF 预览</button>
    <button class="btn ghost" id="btnJson" hidden>下载 JSON</button>
    <button class="btn ghost" id="btnNew" hidden>换一份</button>
  </div>
</header>

<main class="app" id="app">

  <!-- ---------------------------------------------------------- 上传 -->
  <section class="drop" id="drop">
    <div class="drop-inner" id="dropIdle">
      <div class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M11 5h18l8 8v30H11z"/>
          <path d="M29 5v8h8" stroke-linejoin="round"/>
          <path d="M17 26h14M17 32h14M17 20h7" stroke-linecap="round"/>
        </svg>
      </div>
      <h1>把 ESG 报告拖进来</h1>
      <p class="drop-sub">按 S1.1 五个指标召回段落，逐条给出页码、命中词与数值出处。<br>
        只在本机解析（localhost），不上传外网、不落盘。</p>
      <button class="btn primary" id="btnPick">选择 PDF</button>
      <p class="drop-hint">文本层 PDF · 单份 ≤ 120 MB · 扫描件需先 OCR</p>
      <input type="file" id="file" accept=".pdf,application/pdf" hidden>
    </div>

    <div class="drop-inner loading" id="dropLoading" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <h2 id="loadName"></h2>
      <p class="load-step" id="loadStep">读取 PDF 文本层…</p>
      <div class="bar"><i id="bar" class="s0"></i></div>
      <p class="load-time" id="loadTime">已用 0.0s</p>
    </div>

    <div class="drop-inner failure" id="dropError" hidden>
      <h2>解析失败</h2>
      <p id="errMsg"></p>
      <button class="btn primary" id="btnRetry">换一份 PDF</button>
    </div>
  </section>

  <!-- ---------------------------------------------------------- 工作区 -->
  <section class="workspace" id="ws" hidden>
    <nav class="rail" id="rail" aria-label="指标列表"></nav>
    <section class="pane" id="pane"></section>
    <aside class="pdf" id="pdfPane">
      <div class="pdf-bar">
        <span class="pdf-title">PDF 预览</span>
        <a class="link" id="pdfNewTab" target="_blank" rel="noopener">新标签页 ↗</a>
        <button class="btn tiny" id="btnPdfToggle">收起</button>
      </div>
      <div class="pdf-stage">
        <iframe id="pdfFrame" title="PDF 预览"></iframe>
        <div class="pdf-loading" id="pdfLoading" hidden>
          <span class="spinner"></span><span id="pdfLoadingText">正在载入 PDF…</span>
        </div>
      </div>
      <p class="pdf-hint">预览空白时用「新标签页」打开，地址栏的 <code>#page=N</code> 即当前页。</p>
    </aside>
  </section>

</main>

<div class="toast" id="toast" hidden></div>
<script src="explorer.js"></script>
</body>
</html>
