[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-s11-scorer"
version = "1.0.0"
description = "S1.1 五项指标打分模型：读 ESG 报告 PDF → 数值抽取 + 29 要素判定 → 打分 → 可解释报告"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6.0",        # PDF 文本层提取
    "openpyxl>=3.1",     # 报告工作簿
]
readme = "README.md"

# 说明：本包**不独立发布**，运行时还需要同级仓库 50-应用/ESG_insight/app
# （复用其 s11_text / s11_judge / s11_elements）。路径见 config.INSIGHT_APP。
[tool.setuptools]
packages = ["esg_s11_scorer"]

[tool.setuptools.package-data]
esg_s11_scorer = ["README.md"]